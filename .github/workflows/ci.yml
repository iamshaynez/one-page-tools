name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 单元测试
        run: npx vitest run
      - name: 构建
        run: npx astro build
      - name: 无第三方广告/追踪代码检查（自托管第一方统计除外）
        run: |
          if grep -rniE 'adsense|adsbygoogle|doubleclick|googletagmanager|gtag\(|cnzz|hm\.baidu' src/ public/ --include='*.astro' --include='*.ts' --include='*.js' --include='*.html'; then
            echo '发现第三方广告/追踪代码'; exit 1;
          fi
          echo '干净：无第三方广告/追踪代码（自托管第一方统计除外）'
